[package]
name = "siqs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"

[profile.release]
#opt-level = 2
#debug = "line-tables-only"
codegen-units = 1
lto = "fat"
#rustflags = ["-C", "target-cpu=native"]
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = false
codegen-units = 16

[profile.test]
# optimized, since unoptimized factoring tests are slow, but with debug
# assertions on (inherited), so that the debug_assert!s are checked
opt-level = 3

[dependencies]
fixedbitset = "0.5"
colored_text = "0.6"
itertools = "0.15"
rustc-hash = "2.1"
rayon = "1.12"

[dependencies.gmp-mpfr-sys]
version = "1.7"
default-features = false
features = ["use-system-libs"]

[dependencies.rug]
version = "1.30"
default-features = false
features = ["integer", "std"]
