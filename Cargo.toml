[package]
name = "siqs"
version = "0.1.0"
edition = "2024"

[profile.release]
#opt-level = 2
#debug = "line-tables-only"
codegen-units = 1
lto = "fat"
#rustflags = ["-C", "target-cpu=native"]
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = false
codegen-units = 16

[dependencies]
rand = "0.8"
fixedbitset = "0.5"
colored_text = "0.3"
itertools = "0.14"
rustc-hash = "2.1"
rayon = "1.12"

[dependencies.gmp-mpfr-sys]
version = "1.6"
default-features = false
features = ["use-system-libs"]

[dependencies.rug]
version = "1.28"
default-features = false
features = ["integer", "std", "float"]
